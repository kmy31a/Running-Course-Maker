services:
  - type: web
    name: songdo-run-walk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # LLM 문구를 켜려면 Render 대시보드에서 OPENAI_API_KEY(필요하면 OPENAI_MODEL)를 추가하세요 (없으면 규칙 문구 사용)
